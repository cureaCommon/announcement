spring.application.name=announcement
server.port=8087

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=announcement

gateway.trust-secret=${GATEWAY_TRUST_SECRET:}
document.service-url=${DOCUMENT_URL:http://localhost:8086}
announcement.admin-emails=${ANNOUNCEMENT_ADMIN_EMAILS:}
announcement.mail-from=${ANNOUNCEMENT_MAIL_FROM:uretensaglikportali@tuseb.gov.tr}
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
